<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Creator</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="top"><b>🇮🇳 Great India Creator</b><a href="dashboard.html">← Dashboard</a></nav><main class="creator"><section class="card"><span class="pill">🎬 AI VIDEO CREATOR</span><h1>Website को Hindi AI Video में बदलें</h1><p class="muted">AI website के visible content से explanatory script बनाएगा और backend पर video job process करेगा.</p><label>Video Type<select id="category"><option value="short">Short Video (लगभग 45–60 sec)</option><option value="long">Long / Full Video (लगभग 2–4 min)</option></select></label><label>Website / Portal URL<input id="siteUrl" type="url" placeholder="https://example.com"></label><label>Portal Screenshot (optional)<input id="imageFile" type="file" accept="image/*"></label><div class="two"><label>Language<select id="language"><option value="hi-IN">Hindi</option></select></label><label>Voice<select id="voice"><option value="hi-IN-SwaraNeural">Hindi Female AI Voice</option><option value="hi-IN-MadhurNeural">Hindi Male AI Voice</option></select></label></div><label>Extra instruction<textarea id="instruction" rows="4" placeholder="जैसे: Login, registration, dashboard और सभी services समझाएँ।"></textarea><button id="createVideoBtn" class="primary wide">✨ Generate AI Video</button><div id="videoStatus" class="status"></div></section><section id="videoResult" class="card hidden"></section></main><script type="module" src="js/video.js"></script></body></html>
